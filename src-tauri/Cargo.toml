[package]
name = "econ-worksheet"
version = "0.8.0"
description = "Bilingual HKDSE Economics worksheet editor that exports native Microsoft Word .docx"
authors = ["Tino Ho"]
license = "MIT"
repository = "https://github.com/dinomartino/DSE_ECON_Worksheet-editor"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
# Verifies the OCR models build.rs downloads.
sha2 = "0.10"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
# Awaits the native print-to-PDF completion (`src/pdf`); already in the tree via tauri.
tokio = { version = "1", features = ["sync", "time"] }
# The AI provider key in the OS keychain (`src/secrets.rs`). Without these features keyring
# silently falls back to an in-memory mock (Linux, not shipped, still does).
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
# The library folder (`src/library.rs`): content hashes, the watcher (the versions plugin-fs's
# `watch` feature uses), random temp names and the device id.
sha2 = "0.10"
notify = "8"
notify-debouncer-full = "0.6"
getrandom = "0.3"
# Offline OCR (`src/ocr`): PP-OCRv6 small on ONNX Runtime, linked statically (no dylib in the
# bundle). rc.10 pins ONNX Runtime 1.22.0, the last pyke static build that includes Intel Macs.
# CI vendors the same archives through ORT_LIB_LOCATION (`scripts/fetch-onnxruntime.mjs`);
# `download-binaries` is the local fallback and fetches the same file and SHA-256.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "download-binaries"] }
ort-sys = { version = "=2.0.0-rc.10", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Export → PDF writes the file natively (`src/pdf`). The versions wry already pulls in,
# default features off (they default to every framework class).
[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSObject", "NSString", "NSURL", "NSValue", "NSDictionary", "NSGeometry", "NSThread", "NSProcessInfo"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSView", "NSWindow", "NSGraphics"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "objc2-app-kit", "WKWebView"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
# `cloud.rs` lists fixed drives and reads their labels with "no disk" dialogs off.
windows = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug"] }

# The updater has no mobile implementation; keep it off any non-desktop target.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# `tauri dev` and `cargo test` decode and resample whole scanned pages for OCR; unoptimised,
# the image crates take seconds a page.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
