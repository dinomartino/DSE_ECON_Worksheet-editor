[package]
name = "econ-worksheet"
version = "0.2.0"
description = "Bilingual HKDSE Economics worksheet editor that exports native Microsoft Word .docx"
authors = ["Tino Ho"]
license = "MIT"
repository = "https://github.com/dinomartino/DSE_ECON_Worksheet-editor"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"

# The updater has no mobile implementation; keep it off any non-desktop target.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
