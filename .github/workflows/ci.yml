name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# One run per ref: a push that supersedes an in-flight run cancels it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  # The desktop shell's Rust on the systems it ships for: `cfg(windows)` code cannot be
  # checked from a Mac. Debug builds use `devUrl`, so no web build is needed.
  rust:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: cargo check --locked --all-targets

      - run: cargo test --locked
