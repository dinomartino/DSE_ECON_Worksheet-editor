name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# One run per ref: a push that supersedes an in-flight run cancels it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  # The scripts/*.test.ts harnesses are not in `npm test`; they write real files, so their
  # output goes to the runner temp dir. Never add scripts/emit-*-corpus.test.ts here: they
  # rewrite the frozen corpus.
  script-harnesses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: >
          npx vitest run
          scripts/release-notes.test.ts
          scripts/sync-version.test.ts
          scripts/cover-fixtures.test.ts
          scripts/lq-fixtures.test.ts
          scripts/template-gallery.test.ts
          scripts/q6-sample.test.ts
          scripts/emit-samples.test.ts
          scripts/relation-drag.test.ts
        env:
          SAMPLE_DIR: ${{ runner.temp }}/samples
          COVER_DIR: ${{ runner.temp }}/cover
          LQ_DIR: ${{ runner.temp }}/lq
          GALLERY_DIR: ${{ runner.temp }}/gallery
          DRAG_DIR: ${{ runner.temp }}/drag

  # The desktop shell's Rust on the systems it ships for: `cfg(windows)` code cannot be
  # checked from a Mac. Debug builds use `devUrl`, so no web build is needed.
  rust:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # OCR links ONNX Runtime statically. Vendor the pinned, checksummed archive and point
      # ort-sys at it, rather than ort-sys downloading into a cache dir a restored target/
      # would not know is gone.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ort
          key: onnxruntime-1.22.0-${{ runner.os }}-${{ runner.arch }}

      - name: Vendor ONNX Runtime
        shell: bash
        run: |
          dir=$(node ../scripts/fetch-onnxruntime.mjs "$(rustc -vV | sed -n 's/^host: //p')" "$RUNNER_TEMP/ort")
          echo "ORT_LIB_LOCATION=$dir" >> "$GITHUB_ENV"

      # build.rs downloads the OCR models (31 MB, SHA-256 checked) when missing.
      - uses: actions/cache@v4
        with:
          path: src-tauri/resources/ocr/*.onnx*
          key: ocr-models-${{ hashFiles('src-tauri/build.rs') }}

      - run: cargo check --locked --all-targets

      - run: cargo test --locked
