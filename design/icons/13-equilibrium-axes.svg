<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Worksheet">
  <title>Supply and demand — equilibrium on axes</title>
  <!-- 12's equilibrium, geometry untouched: both curves in one cream ink, the accent
       reserved for the point where they meet. The corner rule is fitted *around* the
       cross rather than the cross shrunk to fit it — solid, not arrowed, since
       arrowheads are the first detail to vanish at 16px. -->
  <rect width="512" height="512" rx="114" fill="#3A342E"/>
  <!-- Axes: clear of the strokes' rounded caps at 150 and 362. -->
  <path d="M118 106v288h288" fill="none" stroke="#FCFAF6" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0.34"/>
  <!-- The cross, exactly as in 12. -->
  <g stroke="#FCFAF6" stroke-width="30" stroke-linecap="round" fill="none">
    <path d="M150 150L362 362"/>
    <path d="M150 362L362 150"/>
  </g>
  <circle cx="256" cy="256" r="46" fill="#3A342E"/>
  <circle cx="256" cy="256" r="30" fill="#1E7FD4"/>
</svg>
